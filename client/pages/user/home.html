<!DOCTYPE html>
<html>
<head>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/main.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<body>

  <!-- ✅ Navbar (ONLY ONE) -->
  <div class="navbar">
    <h1>ShopEase</h1>

    <div class="nav-links">
      <a href="home.html">
        <i class="fa-solid fa-house"></i> Home
      </a>

      <a href="cart.html">

      <a href="orders.html">

      <button onclick="logout()">
        <i class="fa-solid fa-right-from-bracket"></i> Logout

    </div>
  </div>

  <!-- ✅ Main Container -->
  <div class="container">

    <!-- 🔍 Search Bar -->
    <div class="search-bar">
      <input type="text" placeholder="Search for products...">
    </div>

    <!-- 🎯 Banner Section -->

    </div>

    

<!-- 🛍 Categories Section -->
<h2 class="section-title">Shop by Category</h2>

<div class="categories">

  <div class="category-card" onclick="window.location.href='category.html?category=Mobiles'">
    <i class="fa-solid fa-mobile-screen-button fa-2x"></i>
    <p>Mobiles</p>
  </div>

  <div class="category-card" onclick="window.location.href='category.html?category=Fashion'">
    <i class="fa-solid fa-shirt fa-2x"></i>
    <p>Fashion</p>
  </div>

  <div class="category-card" onclick="window.location.href='category.html?category=Laptops'">
    <i class="fa-solid fa-laptop fa-2x"></i>
    <p>Laptops</p>
  </div>

  <div class="category-card" onclick="window.location.href='category.html?category=Home'">
    <i class="fa-solid fa-house fa-2x"></i>

  </div>

  <div class="category-card" onclick="window.location.href='category.html?category=Electronics'">
    <i class="fa-solid fa-tv fa-2x"></i>

  </div>

</div>


    <!-- 🛒 Products Section -->
    <h2 class="section-title">Trending Products</h2>
    <div id="products" class="products-grid"></div>

  </div>

  <!-- ✅ Scripts -->
  <script src="../../utils/auth.js"></script>
  <script src="../../utils/products.js"></script>
<script>
  function addToCart(name, price) {

  console.log("Adding:", name);   // for testing

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  cart.push({
    name: name,
    price: price,
    quantity: 1
  });

  localStorage.setItem("cart", JSON.stringify(cart));

  alert("Product Added To Cart");
}
  loadProducts();
</script>
</body>
</html>
